name: test & deploy (agent-0root)

# deterministic CI/CD: every push to main is tested, then deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: determinism + unit tests
        run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Railway's documented CI path is the CLI + a project token (not a marketplace action).
      # 1. create the service in Railway from this repo, 2. add RAILWAY_TOKEN (a *project* token)
      #    to this repo's Actions secrets, 3. set the service name below if it differs.
      - name: deploy to Railway (skips cleanly until RAILWAY_TOKEN is set)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          npm i -g @railway/cli
          railway up --service agent-0root --ci
