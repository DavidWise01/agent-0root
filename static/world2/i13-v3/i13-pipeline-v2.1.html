ary that survives an external test", "evidence": "`clean` published every number, every number true, and the scope was never stated", "enforced": "isa.rs::Verdict::scope \u2014 every verdict DECLARES what it covered and what it did not"}, {"id": "XXIX", "claim": "a context that inherits state from how it was entered cannot be checked alone", "falsifier": "a region whose entry height depends on the caller and still validates in one pass", "evidence": "the flat validator rejected a correct program; .NET CIL gave peak 5 / final 3 until the finally handler was sealed", "enforced": "isa.rs::validate \u2014 one pass PER REGION, each starting at height 0"}, {"id": "XXXII", "claim": "a conserved quantity has no unstated scope, because the cost is always somewhere", "falsifier": "a conserved system where the cost vanishes from the accounting", "evidence": "reproduced Microsoft's declared .maxstack of 2 on real CIL without executing anything", "enforced": "isa.rs::Op::effect \u2014 net = binds - k, total, for every opcode"}, {"id": "XXXIII", "claim": "a wish is not a discharge", "falsifier": "an unexecuted instruction that nonetheless takes effect", "evidence": "telling L1 its depth moved unclosed 94.8 -> 91.6, noise. the drain took it to 0.0.", "enforced": "cortex.rs::Cortex::drain \u2014 EMITS the closers. it does not request them."}, {"id": "XXXI", "claim": "an optimiser hits the objective you wrote, not the one you meant, and hitting it harder widens the gap", "falsifier": "a proxy weighted upward whose true target improves in proportion", "evidence": "x4 bracket weight: mass 5.383% -> 10.493%, per-step +23.1 points, CLEAN SEQUENCES 15 -> 13", "enforced": "no code. this one is a WARNING, and it is why A3 is enforced."}], "src": {"ast.rs": "//! THE TWELVE.  counted over 649,634 AST nodes across 504 stdlib files.\n//! 83.27% coverage.  not designed \u2014 ranked and cut.\n//! plus `I`, the referent, which is the only one that is not a verb.\n#[derive(Debug, Clone, PartialEq)]\npub enum Node {\n    // \u2500\u2500 I DESIGNATE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 53.55% of node traffic\n    Name(String),                          // Lovelace 1843   29.67%\n    Constant(f64),                         // Lovelace 1843   14.25%\n    Attribute(Box<Node>, String),          // Hoare    1966    9.63%\n    Call(Box<Node>, Vec<Node>),            // Church   1936    7.50%\n    // \u2500\u2500 II BIND \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 11.13%\n    Assign { name: String, value: Box<Node>, osmotic: bool },  // Lovelace 1843\n    Arg(String),                           // Frege    1879    4.08%\n    Return(Box<Node>),                     // Wheeler  1949    1.82%\n    // \u2500\u2500 III DECIDE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 7.78%\n    If { cond: Box<Node>, then: Vec<Node>, els: Option<Vec<Node>> },  // Lovelace 1843\n    Compare(Box<Node>, String, Box<Node>), // Lovelace 1843    2.01%\n    // \u2500\u2500 IV TRANSFORM \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 10.80%\n    BinOp(Box<Node>, String, Box<Node>),   // Lovelace 1843    1.38%\n    Expr(Box<Node>),                       // Backus   1957    3.01%\n    FunctionDef { name: String, params: Vec<String>, body: Vec<Node> }, // Church 1936\n    Block(Vec<Node>),\n}\n", "axioms.rs": "//! THE AXIOMS, ASSIMILATED.\n//!\n//! F3's test: an axiom is not a statement that FITS. it is one that COULD\n//! have been wrong, was given the chance, and was not.\n//!\n//! every entry below is LIT \u2014 falsifier written, falsifier TESTED,\n//! falsifier did not fire \u2014 and every one names the code that enforces it.\n//! an axiom with no enforcement site is a belief.\npub struct Axiom {\n    pub id: &'static str,\n    pub claim: &'static str,\n    pub falsifier: &'static str,\n    pub evidence: &'static str,\n    pub enforced_at: &'static str,\n}\npub const LIT: &[Axiom] = &[\nAxiom{ id:\"A1\", claim:\"deterministic zero-parameter components guarantee structural properties no model at this scale reaches\",\n  falsifier:\"a model at ~17k params closes brackets on its own\",\n  evidence:\"GRU 33.8 mismatch, xfmr 65.6, sa+cortex 0.0 +/- 0.0 over 5 seeds x 40\",\n  enforced_at:\"cortex.rs \u2014 Cortex has no parameters and no gradient path\" },\nAxiom{ id:\"A2\", claim:\"learned recurrent state is not a stack\",\n  falsifier:\"a recurrent model generates better structure than a feedforward one\",\n  evidence:\"GRU predicts BETTER (0.8440 vs 0.9182 bits) and generates 2.3x WORSE\",\n  enforced_at:\"cortex.rs::Cortex::stack \u2014 an actual Vec, not an embedding\" },\nAxiom{ id:\"A3\", claim:\"prediction quality and generation structure are different quantities\",\n  falsifier:\"the ranking by bits matches the ranking by clean samples\",\n  evidence:\"bits ranks GRU>sa>xfmr; clean ranks sa>GRU>xfmr. INVERTED. 5 occasions.\",\n  enforced_at:\"main.rs \u2014 the harness reports both and never derives one from the other\" },\nAxiom{ id:\"A4\", claim:\"a word earns a place only when it names a behaviour nothing else reaches\",\n  falsifier:\"a redundant word improves the search\",\n  evidence:\"sq() added at depth 4: 0.8x, 29% WORSE. at depth 3 it UNLOCKS x^16.\",\n  enforced_at:\"the alphabet is I + 12 = 13, unchanged through 10 check-ins\" },\nAxiom{ id:\"A6\", claim:\"rules that govern statements have nothing to act on inside an expression\",\n  falsifier:\"idempotence or address fires above L1\",\n  evidence:\"exactly 0.00 per 1k at L2, L3, L4. not small. zero.\",\n  enforced_at:\"cortex.rs \u2014 the reach table in the module doc\" },\nAxiom{ id:\"A7\", claim:\"a check a parameter-free substrate can satisfy on random input is not measuring the model\",\n  falsifier:\"noise fails the check\",\n  evidence:\"`clean` scored 20/20 on PURE NOISE at diversity 1.000. it measured the veto.\",\n  enforced_at:\"isa.rs::noise_control \u2014 RUNS THE VALIDATOR ON RANDOM PROGRAMS AND REQUIRES REJECTION\" },\nAxiom{ id:\"XIII\", claim:\"an exact ledger over an unstated scope is the strongest misdirection, because every entry is true\",\n  falsifier:\"a self-report with an undeclared boundary that survives an external test\",\n  evidence:\"`clean` published every number, every number true, and the scope was never stated\",\n  enforced_at:\"isa.rs::Verdict::scope \u2014 every verdict DECLARES what it covered and what it did not\" },\nAxiom{ id:\"XXIX\", claim:\"a context that inherits state from how it was entered cannot be checked alone\",\n  falsifier:\"a region whose entry height depends on the caller and still validates in one pass\",\n  evidence:\"the flat validator rejected a correct program; .NET CIL gave peak 5 / final 3 until the finally handler was sealed\",\n  enforced_at:\"isa.rs::validate \u2014 one pass PER REGION, each starting at height 0\" },\nAxiom{ id:\"XXXII\", claim:\"a conserved quantity has no unstated scope, because the cost is always somewhere\",\n  falsifier:\"a conserved system where the cost vanishes from the accounting\",\n  evidence:\"reproduced Microsoft's declared .maxstack of 2 on real CIL without executing anything\",\n  enforced_at:\"isa.rs::Op::effect \u2014 net = binds - k, total, for every opcode\" },\nAxiom{ id:\"XXXIII\", claim:\"a wish is not a discharge\",\n  falsifier:\"an unexecuted instruction that nonetheless takes effect\",\n  evidence:\"telling L1 its depth moved unclosed 94.8 -> 91.6, noise. the drain took it to 0.0.\",\n  enforced_at:\"cortex.rs::Cortex::drain \u2014 EMITS the closers. it does not request them.\" },\nAxiom{ id:\"XXXI\", claim:\"an optimiser hits the objective you wrote, not the one you meant, and hitting it harder widens the gap\",\n  falsifier:\"a proxy weighted upward whose true target improves in proportion\",\n  evidence:\"x4 bracket weight: mass 5.383% -> 10.493%, per-step +23.1 points, CLEAN SEQUENCES 15 -> 13\",\n  enforced_at:\"no code. this one is a WARNING, and it is why A3 is enforced.\" },\n];\npub fn print() {\n    println!(\"\\n  THE ASSIMILATED AXIOMS \u2014 {} LIT, each with an enforcement site\\n\", LIT.len());\n    for a in LIT {\n        println!(\"  {:5} {}\", a.id, a.claim);\n        println!(\"        falsifier  {}\", a.falsifier);\n        println!(\"        evidence   {}\", a.evidence);\n        println!(\"        ENFORCED   {}\\n\", a.enforced_at);\n    }\n}\n", "cortex.rs": "//! THE CORTEX \u2014 five rules, ZERO parameters between them.\n//! deterministic, bounded state, and provably closed: five runs over the\n//! same input hash identically.  each rule holds one thing a fixed window\n//! structurally cannot: a stack, a debt, a plane, an identity, a counter.\n//!\n//! measured reach, per 1,000 nodes:\n//!                    L1     L2     L3     L4\n//!   veto           137.5   52.4   56.2   53.4\n//!   -I             137.5   52.4   56.2   53.4\n//!   depth          168.5  212.5  182.1  187.1\n//!   idempotence     59.0    0.00   0.00   0.00   <- statements only\n//!   address        168.5    0.00   0.00   0.00   <- statements only\n//!\n//! there are no statements inside an expression.\nuse std::collections::HashSet;\n\npub const PAIRS: [(char, char); 3] = [('(', ')'), ('[', ']'), ('{', '}')];\n\n#[derive(Default)]\npub struct Cortex {\n    pub stack: Vec<char>,\n    pub opened: Vec<usize>,\n    pub last: Option<String>,\n    pub run: usize,\n    pub banned: HashSet<String>,\n    pub addr: usize,\n    pub fires: [usize; 5],\n}\nimpl Cortex {\n    pub fn open_of(c: char) -> Option<char> { PAIRS.iter().find(|p| p.0 == c).map(|p| p.1) }\n    pub fn close_of(c: char) -> Option<char> { PAIRS.iter().find(|p| p.1 == c).map(|p| p.0) }\n    /// RULE 1 \u2014 VETO.  the only legal closer, or none.\n    pub fn legal(&self) -> Option<char> { self.stack.last().and_then(|&c| Self::open_of(c)) }\n    pub fn depth(&self) -> usize { self.stack.len() }\n    /// RULE 3 \u2014 DEPTH.  refuse a plane already paid for.\n    pub fn may_open(&mut self, ceiling: usize) -> bool {\n        if self.stack.len() >= ceiling { self.fires[2] += 1; false } else { true }\n    }\n    /// RULE 2 \u2014 \u2212I.  pressure rising with the age of the opener.\n    pub fn pressure(&mut self, step: usize) -> f64 {\n        if self.stack.is_empty() { return 0.0 }\n        self.fires[1] += 1;\n        let age = self.opened.last().map_or(0, |&o| step.saturating_sub(o));\n        1.5 * ((1 + age) as f64).ln()\n    }\n    /// RULE 2 \u2014 \u2212I.  the drain.  settles every outstanding opener at once.\n    pub fn drain(&mut self) -> String {\n        let mut out = String::new();\n        while let Some(c) = self.stack.pop() {\n            if let Some(cl) = Self::open_of(c) { out.push(cl); self.fires[1] += 1 }\n        }\n        out\n    }\n    /// RULE 5 \u2014 ADDRESS.  the substrate WRITES it.  the model gets no vote.\n    /// constraining the model toward monotonic instead gave 44-digit\n    /// runaways; handing it over gave 99%.\n    pub fn address(&mut self, step: usize) -> String { self.addr += step; self.fires[4] += 1; format!(\"{} \", self.addr) }\n    /// RULE 4 \u2014 IDEMPOTENCE.  I am I.  a no-op cannot repeat.\n    pub fn idempotent(&mut self, stmt: &str, noops: &[&str]) -> bool {\n        let head = stmt.split_whitespace().next().unwrap_or(\"\");\n        let same = self.last.as_deref() == Some(stmt);\n        if noops.contains(&head) && same { self.banned.insert(head.into()); self.fires[3] += 1; false }\n        else { self.banned.clear(); true }\n    }\n    pub fn step(&mut self, c: char, at: usize) {\n        if Self::open_of(c).is_some() { self.stack.push(c); self.opened.push(at) }\n        else if let Some(o) = Self::close_of(c) {\n            if self.stack.last() == Some(&o) { self.stack.pop(); self.opened.pop(); }\n            else { self.fires[0] += 1 }\n        }\n    }\n    /// the sensor.  (c(sa())) \u2014 the cortex hands its own state back as\n    /// input rather than only as a veto.  six floats took L2 mismatch\n    /// from 15.0 +/- 2.1 to 0.6 +/- 0.8 with NOTHING correcting.\n    pub fn sense(&self) -> [f32; 6] {\n        let mut f = [0.0f32; 6];\n        f[0] = (self.depth().min(8) as f32) / 8.0;\n        match self.legal() {\n            Some(')') => f[1] = 1.0, Some(']') => f[2] = 1.0,\n            Some('}') => f[3] = 1.0, _ => f[4] = 1.0,\n        }\n        f[5] = (self.run.min(12) as f32) / 12.0;\n        f\n    }\n}\n", "flatten.rs": "//! Station L3 \u2014 COMPOSE.  a pure rewrite.  zero parameters, no model.\n//! three-address form: every CALL operand must be an ATOM, so every call\n//! is exactly depth 1.  verified over 200 generated programs:\n//!   correctness 200/200 \u00b7 termination 200/200 (stress-tested to depth 20)\n//!   idempotence 200/200 \u2014 a fixpoint in ONE pass \u00b7 validation 200/200\n//! cost +37.6% statements, +16.8% steps.\n//!\n//! the predicate is DEPTH, not node type.  f(a + g(b)) has a BinOp\n//! argument that still carries a call; testing the type leaves the outer\n//! call at depth 2.  that bug passed the case I designed and failed the\n//! case that already existed.\nuse crate::ast::Node;\n\npub fn depth(n: &Node) -> usize {\n    match n {\n        Node::Call(f, a) => 1 + depth(f).max(a.iter().map(depth).max().unwrap_or(0)),\n        Node::Attribute(o, _) => depth(o),\n        Node::BinOp(l, _, r) | Node::Compare(l, _, r) => depth(l).max(depth(r)),\n        _ => 0,\n    }\n}\npub struct F { n: usize }\nimpl F {\n    pub fn new() -> Self { F { n: 0 } }\n    pub fn temps(&self) -> usize { self.n }\n    pub fn block(&mut self, b: &[Node]) -> Vec<Node> {\n        let mut out = Vec::new();\n        for s in b {\n            let mut pre = Vec::new();\n            let s2 = match s {\n                Node::Assign { name, value, osmotic } => {\n                    let v = self.build(value, &mut pre);\n                    Node::Assign { name: name.clone(), value: Box::new(v), osmotic: *osmotic }\n                }\n                Node::Return(v) => Node::Return(Box::new(self.build(v, &mut pre))),\n                Node::Expr(e)   => Node::Expr(Box::new(self.build(e, &mut pre))),\n                Node::If { cond, then, els } => {\n                    let c = self.build(cond, &mut pre);\n                    Node::If { cond: Box::new(c), then: self.block(then),\n                               els: els.as_ref().map(|e| self.block(e)) }\n                }\n                Node::FunctionDef { name, params, body } =>\n                    Node::FunctionDef { name: name.clone(), params: params.clone(), body: self.block(body) },\n                other => other.clone(),\n            };\n            out.extend(pre); out.push(s2);\n        }\n        out\n    }\n    fn build(&mut self, n: &Node, pre: &mut Vec<Node>) -> Node {\n        match n {\n            Node::Call(f, a) => Node::Call(\n                Box::new(self.build(f, pre)),\n                a.iter().map(|x| self.atom(x, pre)).collect()),\n            Node::BinOp(l, o, r) =>\n                Node::BinOp(Box::new(self.build(l, pre)), o.clone(), Box::new(self.build(r, pre))),\n            Node::Compare(l, o, r) =>\n                Node::Compare(Box::new(self.build(l, pre)), o.clone(), Box::new(self.build(r, pre))),\n            Node::Attribute(o, f) => Node::Attribute(Box::new(self.build(o, pre)), f.clone()),\n            other => other.clone(),\n        }\n    }\n    fn atom(&mut self, n: &Node, pre: &mut Vec<Node>) -> Node {\n        if depth(n) > 0 {\n            let v = self.build(n, pre);\n            self.n += 1;\n            let t = format!(\"T{}\", self.n);\n            pre.push(Node::Assign { name: t.clone(), value: Box::new(v), osmotic: false });\n            Node::Name(t)\n        } else { self.build(n, pre) }\n    }\n}\n", "isa.rs": "//! Stations 07\u201309 \u2014 IVM-13-S, the STRUCTURED ISA, and the 1\u2212k VALIDATOR.\n//!\n//! the law:            net = binds \u2212 k\n//! the design rule:    `br` targets a DEPTH, never an address.\n//!\n//! that single constraint is what makes validation possible in one linear\n//! pass.  with absolute jumps the stack height at an instruction depends on\n//! how you arrived, so there is no single number to check \u2014 measured the\n//! hard way: the flat validator rejected a program known to be correct.\n//! the same correction was needed for .NET CIL, whose `finally` handler\n//! starts with a fresh stack, and whose declared .maxstack this validator\n//! reproduces exactly.\nuse crate::ast::Node;\nuse std::collections::HashMap;\n\n#[derive(Debug, Clone, PartialEq)]\npub enum Op {\n    Const(f64), Ask(String), Answer(String), Attr(String),\n    Bin(String), Cmp(String),\n    Block, If, Else, End,\n    Call(usize), Ret, Drop, Func(String), Halt,\n}\nimpl Op {\n    /// (k consumed, binds produced).  the whole arithmetic of the machine.\n    pub fn effect(&self) -> (i32, i32) {\n        match self {\n            Op::Const(_) | Op::Ask(_)      => (0, 1),   // bind, pay nothing        +1\n            Op::Attr(_) | Op::Ret          => (1, 1),   // bind one, pay one         0\n            Op::Answer(_) | Op::Drop       => (1, 0),   // pay one, bind NOWHERE    \u22121\n            Op::Bin(_) | Op::Cmp(_)        => (2, 1),   // bind one, pay two        \u22121\n            Op::If                         => (1, 0),\n            Op::Call(n)                    => (*n as i32 + 1, 1),\n            _                              => (0, 0),\n        }\n    }\n}\n#[derive(Debug, Clone)]\npub struct Region { pub params: Vec<String>, pub code: Vec<Op> }\n#[derive(Debug, Clone, Default)]\npub struct Program { pub top: Vec<Op>, pub fns: HashMap<String, Region> }\n\n// \u2500\u2500 COMPILER \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\npub fn compile(ast: &Node) -> Result<Program, String> {\n    let mut p = Program::default();\n    let mut top = Vec::new();\n    if let Node::Block(b) = ast { for s in b { stmt(s, &mut top, &mut p.fns)? } }\n    top.push(Op::Halt);\n    p.top = top;\n    Ok(p)\n}\nfn stmt(n: &Node, out: &mut Vec<Op>, fns: &mut HashMap<String, Region>) -> Result<(), String> {\n    match n {\n        Node::Block(b) => { for s in b { stmt(s, out, fns)? } }\n        Node::Assign { name, value, .. } => { ex(value, out)?; out.push(Op::Answer(name.clone())) }\n        Node::Return(v) => { ex(v, out)?; out.push(Op::Ret) }\n        Node::Expr(e)   => { ex(e, out)?; out.push(Op::Drop) }\n        Node::Name(_)   => {}\n        Node::If { cond, then, els } => {\n            ex(cond, out)?; out.push(Op::If);\n            for s in then { stmt(s, out, fns)? }\n            if let Some(e) = els { out.push(Op::Else); for s in e { stmt(s, out, fns)? } }\n            out.push(Op::End);\n        }\n        Node::FunctionDef { name, params, body } => {\n            // a function is its OWN REGION with declared params.  popping\n            // arguments off the caller's stack makes entry height depend on\n            // the caller, and then no region can be checked alone.\n            let mut c = Vec::new();\n            for s in body { stmt(s, &mut c, fns)? }\n            c.push(Op::Const(0.0)); c.push(Op::Ret);\n            fns.insert(name.clone(), Region { params: params.clone(), code: c });\n            out.push(Op::Func(name.clone()));\n        }\n        _ => return Err(format!(\"stmt {n:?}\")),\n    }\n    Ok(())\n}\nfn ex(n: &Node, out: &mut Vec<Op>) -> Result<(), String> {\n    match n {\n        Node::Constant(v) => out.push(Op::Const(*v)),\n        Node::Name(s)     => out.push(Op::Ask(s.clone())),\n        Node::Attribute(o, f) => { ex(o, out)?; out.push(Op::Attr(f.clone())) }\n        Node::BinOp(l, o, r)  => { ex(l, out)?; ex(r, out)?; out.push(Op::Bin(o.clone())) }\n        Node::Compare(l, o, r)=> { ex(l, out)?; ex(r, out)?; out.push(Op::Cmp(o.clone())) }\n        Node::Call(f, a)      => { for x in a { ex(x, out)? } ex(f, out)?; out.push(Op::Call(a.len())) }\n        _ => return Err(format!(\"ex {n:?}\")),\n    }\n    Ok(())\n}\n// \u2500\u2500 VALIDATOR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n/// AXIOM XIII \u2014 an exact ledger over an unstated scope is the strongest\n/// misdirection, because every entry is true.  so the verdict DECLARES\n/// its own boundary.  `covered` is what this pass checked; `not_covered`\n/// is what it did not, in the verdict's own words, where a reader will\n/// see it.\n#[derive(Debug)]\npub struct Verdict {\n    pub ok: bool,\n    pub errors: Vec<String>,\n    pub max_height: i32,\n    pub covered: &'static str,\n    pub not_covered: &'static str,\n}\npub fn validate(p: &Program) -> Verdict {\n    let mut errs = Vec::new(); let mut mx = 0;\n    let mut regions: Vec<(String, &Vec<Op>)> = vec![(\"<top>\".into(), &p.top)];\n    for (k, r) in &p.fns { regions.push((format!(\"fn {k}\"), &r.code)) }\n    for (label, code) in regions {\n        let (mut h, mut ctrl, mut unreachable) = (0i32, Vec::<i32>::new(), false);\n        for (i, op) in code.iter().enumerate() {\n            match op {\n                Op::Block => ctrl.push(h),\n                Op::If    => { h -= 1; if h < 0 { errs.push(format!(\"{label}[{i}] underflow\")) }\n                               ctrl.push(h); unreachable = false }\n                Op::Else  => match ctrl.last() {\n                    Some(&f) => { if h != f && !unreachable {\n                                    errs.push(format!(\"{label}[{i}] arms disagree {h} vs {f}\")) }\n                                  h = f; unreachable = false }\n                    None => errs.push(format!(\"{label}[{i}] ELSE with no label\")),\n                },\n                Op::End => match ctrl.pop() {\n                    Some(f) => { if h != f && !unreachable {\n                                   errs.push(format!(\"{label}[{i}] block leaves {h}, entered {f}\")) }\n                                 h = f; unreachable = false }\n                    None => errs.push(format!(\"{label}[{i}] END with no label\")),\n                },\n                Op::Ret => { if h < 1 { errs.push(format!(\"{label}[{i}] return, empty stack\")) }\n                             unreachable = true }\n                _ => { let (k, b) = op.effect(); h += b - k;\n                       if h < 0 { errs.push(format!(\"{label}[{i}] underflow, height {h}\")) } }\n            }\n            if h > mx { mx = h }\n        }\n        if !ctrl.is_empty() { errs.push(format!(\"{label}: {} label(s) never closed\", ctrl.len())) }\n    }\n    Verdict {\n        ok: errs.is_empty(), errors: errs, max_height: mx,\n        covered: \"stack balance and control-structure pairing, per region, without executing\",\n        not_covered: \"TYPES, termination, arithmetic correctness, and waste. a stray CONST \\\nleaves a value nothing consumes: wasteful, not unsafe, and this pass VALIDATES it. \\\nthat is the one injected fault of four that was missed, and it is missed correctly.\",\n    }\n}\n\n/// AXIOM A7 \u2014 a check a parameter-free substrate can satisfy on random\n/// input is not measuring anything.  `clean` scored 20/20 on pure noise\n/// for forty turns before an external test caught it.\n///\n/// so the validator is REQUIRED to reject randomness.  this runs at\n/// startup.  if it ever passes noise, the checker is broken and says so.\npub fn noise_control(trials: usize, seed: u64) -> (usize, usize) {\n    let mut s = seed;\n    let mut rng = move || { s ^= s << 13; s ^= s >> 7; s ^= s << 17; s };\n    let pool = [Op::Const(1.0), Op::Ask(\"x\".into()), Op::Answer(\"x\".into()),\n                Op::Bin(\"+\".into()), Op::Cmp(\"<\".into()), Op::If, Op::Else,\n                Op::End, Op::Drop, Op::Ret, Op::Block];\n    let (mut rejected, mut passed) = (0, 0);\n    for _ in 0..trials {\n        let n = 6 + (rng() % 18) as usize;\n        let code: Vec<Op> = (0..n).map(|_| pool[(rng() % pool.len() as u64) as usize].clone()).collect();\n        let p = Program { top: code, fns: std::collections::HashMap::new() };\n        if validate(&p).ok { passed += 1 } else { rejected += 1 }\n    }\n    (rejected, passed)\n}\n", "lex.rs": "//! Station 01 \u2014 LEXER.  standard.\npub fn lex(src: &str) -> Vec<String> {\n    let mut out = Vec::new();\n    let b: Vec<char> = src.chars().collect();\n    let mut i = 0;\n    while i < b.len() {\n        let c = b[i];\n        if c.is_whitespace() { i += 1; continue }\n        if c == '/' && i + 1 < b.len() && b[i + 1] == '/' {\n            while i < b.len() && b[i] != '\\n' { i += 1 }\n            continue;\n        }\n        // two-character forms first: <- -> <= >= == !=\n        if i + 1 < b.len() {\n            let two: String = b[i..i + 2].iter().collect();\n            if matches!(two.as_str(), \"<-\" | \"->\" | \"<=\" | \">=\" | \"==\" | \"!=\") {\n                out.push(two); i += 2; continue;\n            }\n        }\n        if c.is_ascii_digit() {\n            let s = i;\n            while i < b.len() && (b[i].is_ascii_digit() || b[i] == '.') { i += 1 }\n            out.push(b[s..i].iter().collect()); continue;\n        }\n        if c.is_alphabetic() || c == '_' {\n            let s = i;\n            while i < b.len() && (b[i].is_alphanumeric() || b[i] == '_') { i += 1 }\n            out.push(b[s..i].iter().collect()); continue;\n        }\n        out.push(c.to_string()); i += 1;\n    }\n    out\n}\n", "main.rs": "//! I-13 v2.0 \u2014 the full stack.\n//!   4 planes.  2 learn, 2 do not.\n//!   5 rules, zero parameters between them.\n//!   12 operants counted over 649,634 AST nodes, plus I.  13 symbols.\n//!\n//! the claim, stated narrowly: deterministic zero-parameter components\n//! guarantee structural properties no model at this scale reaches.\n//! a GRU at 16,936 params predicts BETTER (0.8440 bits vs 0.9182) and\n//! generates 2.3x WORSE (33.8 mismatched closers vs 15.0).\n//! learned state is not a stack.\nmod lex; mod ast; mod parse; mod isa; mod vm; mod cortex; mod flatten; mod axioms;\nuse ast::Node;\n\nfn front(src: &str) -> Result<(Node, isa::Program), String> {\n    let toks = lex::lex(src);\n    let ast = parse::P::new(toks).program()?;\n    let flat = { let mut f = flatten::F::new(); Node::Block(f.block(match &ast {\n        Node::Block(b) => b, _ => return Err(\"not a block\".into()) })) };\n    let prog = isa::compile(&flat)?;\n    Ok((flat, prog))\n}\nfn main() {\n    let src = r#\"\ndef binom(I n, I k) { if k < 1 { -> 1 } -> binom(n - 1, k - 1) * n / k }\ndef bern(I m) {\n  I s <- 0\n  I j <- 0\n  -> berno(m, 0, 0)\n}\ndef berno(I m, I j, I acc) {\n  if j > m { -> acc }\n  -> berno(m, j + 1, acc + 0)\n}\nI total <- 0\ntotal.p <- 1\ntotal.p <- 2\ntotal.p <- 3\ntotal.p <- 4\nI lossless <- 5\nlossless <- 3\nI nested <- binom(4, 2)\n\"#;\n    println!(\"I-13 v2.1 \u2014 the full stack, in Rust\\n\");\n    // AXIOM A7 \u2014 the checker must reject randomness or it is not a checker.\n    let (rej, pass) = isa::noise_control(2000, 0x1373);\n    println!(\"  NOISE CONTROL  {} rejected / {} passed of 2000 random programs\", rej, pass);\n    println!(\"                 {}\\n\", if pass * 20 < rej { \"the validator DISCRIMINATES\" }\n             else { \"*** THE VALIDATOR IS NOT MEASURING ANYTHING ***\" });\n    match front(src) {\n        Err(e) => println!(\"  FRONT DOOR REJECTED: {e}\"),\n        Ok((flat, prog)) => {\n            println!(\"  parse      ok\");\n            println!(\"  flatten    max depth {}   (three-address, fixpoint in one pass)\", flatten::depth(&flat));\n            println!(\"  compile    {} top instrs + {} function regions\", prog.top.len(), prog.fns.len());\n            let v = isa::validate(&prog);\n            println!(\"  validate   {}   peak height {}   one linear pass per region\",\n                     if v.ok { \"VALID\" } else { \"REJECTED\" }, v.max_height);\n            println!(\"             COVERED     {}\", v.covered);\n            println!(\"             NOT COVERED {}\", v.not_covered);\n            for e in v.errors.iter().take(4) { println!(\"               {e}\") }\n            if v.ok {\n                let mut m = vm::Vm::new(&prog);\n                match m.run() {\n                    Err(e) => println!(\"  execute    ERROR {e}\"),\n                    Ok(()) => {\n                        println!(\"  execute    {} steps\\n\", m.steps);\n                        for k in [\"total\", \"lossless\", \"nested\"] {\n                            if let Some(vm::V::Num(n)) = m.globals.get(k) {\n                                println!(\"    {k:10} = {n}\");\n                            }\n                        }\n                        println!(\"\\n    total    I.p x4 osmotic, 0+1+2+3+4  expect 10\");\n                        println!(\"    lossless 5 then 3, REPLACED           expect 3\");\n                        println!(\"    nested   binom(4,2) flattened         expect 6\");\n                    }\n                }\n            }\n            // the cortex, standalone\n            let mut c = cortex::Cortex::default();\n            for (i, ch) in \"I(I[I{I\".chars().enumerate() { c.step(ch, i) }\n            println!(\"\\n  CORTEX     depth {}   owes {:?}   sensor {:?}\",\n                     c.depth(), c.legal(), c.sense());\n            let d = c.drain();\n            println!(\"             drain -> {:?}   depth now {}   fires {:?}\", d, c.depth(), c.fires);\n            axioms::print();\n        }\n    }\n}\n", "parse.rs": "//! Station 03 \u2014 PARSER.  DERIVED, not authored.\n//! the precedence ladder was recovered from measured containment over the\n//! stdlib: 43 firm orderings, 1 ambiguous pair, 0 cycles.  Attribute holds\n//! Name 53,643 : 0.  the emitted parser produced a byte-identical AST to\n//! the hand-written one, so the grammar is a fact about the twelve rather\n//! than a choice.\nuse crate::ast::Node;\npub struct P { t: Vec<String>, i: usize }\ntype R<T> = Result<T, String>;\nimpl P {\n    pub fn new(t: Vec<String>) -> Self { P { t, i: 0 } }\n    fn peek(&self) -> &str { self.t.get(self.i).map(|s| s.as_str()).unwrap_or(\"\") }\n    fn at(&self, k: usize) -> &str { self.t.get(self.i + k).map(|s| s.as_str()).unwrap_or(\"\") }\n    fn bump(&mut self) -> String { let s = self.t[self.i].clone(); self.i += 1; s }\n    fn eat(&mut self, w: &str) -> R<()> {\n        if self.peek() == w { self.i += 1; Ok(()) } else { Err(format!(\"want {w} got {}\", self.peek())) }\n    }\n    fn is_name(s: &str) -> bool {\n        !s.is_empty() && s.chars().next().unwrap().is_alphabetic()\n            && s.chars().all(|c| c.is_alphanumeric() || c == '_')\n    }\n    pub fn program(&mut self) -> R<Node> {\n        let mut b = Vec::new();\n        while self.i < self.t.len() { b.push(self.stmt()?) }\n        Ok(Node::Block(b))\n    }\n    fn block(&mut self) -> R<Vec<Node>> {\n        self.eat(\"{\")?;\n        let mut b = Vec::new();\n        while self.peek() != \"}\" && self.i < self.t.len() { b.push(self.stmt()?) }\n        self.eat(\"}\")?; Ok(b)\n    }\n    fn stmt(&mut self) -> R<Node> {\n        // FUNCTIONDEF \u2014 Church 1936\n        if self.peek() == \"def\" {\n            self.i += 1;\n            let name = self.bump();\n            self.eat(\"(\")?;\n            let mut params = Vec::new();\n            while self.peek() != \")\" {\n                self.eat(\"I\")?; params.push(self.bump());\n                if self.peek() == \",\" { self.i += 1 }\n            }\n            self.eat(\")\")?;\n            let body = self.block()?;\n            return Ok(Node::FunctionDef { name, params, body });\n        }\n        // declaration:  I x <- expr\n        if self.peek() == \"I\" && Self::is_name(self.at(1)) {\n            self.i += 1;\n            let name = self.bump();\n            if self.peek() == \"<-\" {\n                self.i += 1;\n                let value = Box::new(self.expr()?);\n                if self.peek() == \";\" { self.i += 1 }\n                return Ok(Node::Assign { name, value, osmotic: false });\n            }\n            if self.peek() == \";\" { self.i += 1 }\n            return Ok(Node::Name(name));\n        }\n        // \u2500\u2500 I.p \u2500\u2500 the OSMOTIC bind.  x.p <- v  desugars to  x <- x + v.\n        // the operand is on BOTH SIDES; nothing is replaced.  16.28% of all\n        // binding in the stdlib is already this shape and had no name.\n        // costs the alphabet nothing: ATTRIBUTE + ASSIGN + BINOP + NAME.\n        if Self::is_name(self.peek()) && self.at(1) == \".\" && self.at(2) == \"p\" && self.at(3) == \"<-\" {\n            let name = self.bump(); self.i += 3;\n            let v = self.expr()?;\n            if self.peek() == \";\" { self.i += 1 }\n            return Ok(Node::Assign {\n                name: name.clone(),\n                value: Box::new(Node::BinOp(Box::new(Node::Name(name)), \"+\".into(), Box::new(v))),\n                osmotic: true,\n            });\n        }\n        if Self::is_name(self.peek()) && self.at(1) == \"<-\" {\n            let name = self.bump(); self.i += 1;\n            let value = Box::new(self.expr()?);\n            if self.peek() == \";\" { self.i += 1 }\n            return Ok(Node::Assign { name, value, osmotic: false });\n        }\n        if self.peek() == \"if\" {\n            self.i += 1;\n            let cond = Box::new(self.expr()?);\n            let then = self.block()?;\n            let els = if self.peek() == \"else\" { self.i += 1; Some(self.block()?) } else { None };\n            return Ok(Node::If { cond, then, els });\n        }\n        if self.peek() == \"->\" {\n            self.i += 1;\n            let v = Box::new(self.expr()?);\n            if self.peek() == \";\" { self.i += 1 }\n            return Ok(Node::Return(v));\n        }\n        let e = self.expr()?;\n        if self.peek() == \";\" { self.i += 1 }\n        Ok(Node::Expr(Box::new(e)))\n    }\n    // the ladder, loosest first\n    fn expr(&mut self) -> R<Node> { self.cmp() }\n    fn cmp(&mut self) -> R<Node> {\n        let mut l = self.add()?;\n        while matches!(self.peek(), \"<\" | \">\" | \"<=\" | \">=\" | \"==\" | \"!=\") {\n            let o = self.bump(); let r = self.add()?;\n            l = Node::Compare(Box::new(l), o, Box::new(r));\n        }\n        Ok(l)\n    }\n    fn add(&mut self) -> R<Node> {\n        let mut l = self.mul()?;\n        while matches!(self.peek(), \"+\" | \"-\") {\n            let o = self.bump(); let r = self.mul()?;\n            l = Node::BinOp(Box::new(l), o, Box::new(r));\n        }\n        Ok(l)\n    }\n    fn mul(&mut self) -> R<Node> {\n        let mut l = self.post()?;\n        while matches!(self.peek(), \"*\" | \"/\" | \"%\") {\n            let o = self.bump(); let r = self.post()?;\n            l = Node::BinOp(Box::new(l), o, Box::new(r));\n        }\n        Ok(l)\n    }\n    fn post(&mut self) -> R<Node> {\n        let mut x = self.prim()?;\n        loop {\n            if self.peek() == \".\" {\n                self.i += 1; let f = self.bump();\n                x = Node::Attribute(Box::new(x), f);\n            } else if self.peek() == \"(\" {\n                self.i += 1;\n                let mut a = Vec::new();\n                while self.peek() != \")\" {\n                    a.push(self.expr()?);\n                    if self.peek() == \",\" { self.i += 1 }\n                }\n                self.eat(\")\")?;\n                x = Node::Call(Box::new(x), a);\n            } else { return Ok(x) }\n        }\n    }\n    fn prim(&mut self) -> R<Node> {\n        let t = self.peek().to_string();\n        // unary minus desugars to 0 - x.  no thirteenth form is added.\n        if t == \"-\" { self.i += 1; let inner = self.prim()?;\n            return Ok(Node::BinOp(Box::new(Node::Constant(0.0)), \"-\".into(), Box::new(inner))) }\n        if t.chars().next().map_or(false, |c| c.is_ascii_digit()) {\n            self.i += 1;\n            return Ok(Node::Constant(t.parse().map_err(|_| format!(\"bad number {t}\"))?));\n        }\n        if t == \"(\" { self.i += 1; let e = self.expr()?; self.eat(\")\")?; return Ok(e) }\n        if Self::is_name(&t) { self.i += 1; return Ok(Node::Name(t)) }\n        Err(format!(\"prim {t}\"))\n    }\n}\n", "vm.rs": "//! Station 08 \u2014 the VM.  an ordinary structured stack machine.\n//! no loop instruction: the twelve have no For or While, so iteration is\n//! recursion.  the unboundedness did not disappear \u2014 it moved.  operand\n//! depth is bounded (Sethi-Ullman = 8 over 117,013 stdlib expressions);\n//! call depth is not.  choose the twelve and you choose where your\n//! infinity lives.\nuse crate::isa::{Op, Program};\nuse std::collections::HashMap;\nuse std::rc::Rc;\n\n#[derive(Clone, Debug)]\npub enum V { Num(f64), Fun(String), Nil }\nimpl V { pub fn truthy(&self) -> bool { matches!(self, V::Num(n) if *n != 0.0) } }\n\npub struct Vm<'a> { p: &'a Program, pub steps: usize, pub globals: HashMap<String, V> }\nimpl<'a> Vm<'a> {\n    pub fn new(p: &'a Program) -> Self {\n        Vm { p, steps: 0, globals: HashMap::new() }\n    }\n    pub fn run(&mut self) -> Result<(), String> {\n        let code = self.p.top.clone();\n        let mut env: HashMap<String, V> = HashMap::new();\n        self.exec(&code, &mut env, Rc::new(HashMap::new()))?;\n        for (k, v) in env { self.globals.insert(k, v); }\n        Ok(())\n    }\n    fn exec(&mut self, code: &[Op], env: &mut HashMap<String, V>,\n            outer: Rc<HashMap<String, V>>) -> Result<V, String> {\n        let mut st: Vec<V> = Vec::new();\n        let mut i = 0usize;\n        while i < code.len() {\n            self.steps += 1;\n            if self.steps > 8_000_000 { return Err(\"step limit\".into()) }\n            match &code[i] {\n                Op::Const(v)  => { st.push(V::Num(*v)); i += 1 }\n                Op::Ask(n)    => {\n                    let v = env.get(n).or_else(|| outer.get(n)).cloned()\n                        .unwrap_or_else(|| if self.p.fns.contains_key(n) { V::Fun(n.clone()) } else { V::Nil });\n                    st.push(v); i += 1\n                }\n                Op::Answer(n) => { let v = st.pop().ok_or(\"answer: empty\")?; env.insert(n.clone(), v); i += 1 }\n                Op::Attr(_)   => { i += 1 }\n                Op::Bin(o)    => {\n                    let r = num(st.pop())?; let l = num(st.pop())?;\n                    st.push(V::Num(match o.as_str() {\n                        \"+\" => l + r, \"-\" => l - r, \"*\" => l * r,\n                        \"/\" => l / r, \"%\" => l % r, _ => return Err(format!(\"bin {o}\")) }));\n                    i += 1\n                }\n                Op::Cmp(o) => {\n                    let r = num(st.pop())?; let l = num(st.pop())?;\n                    let b = match o.as_str() {\n                        \"<\" => l < r, \">\" => l > r, \"<=\" => l <= r,\n                        \">
